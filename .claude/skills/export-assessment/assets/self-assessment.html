<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{{TITLE}}</title>
<style>
  @page { size: A4; margin: 15mm 14mm; }
  :root { --text: #1d2330; --muted: #5f6b7a; --border: #dde2ea; --soft: #f4f6f9;
          --current: #2f6fde; --current-soft: #e7effd; --next: #7a4cd9; --next-soft: #f1ebfd;
          --yes: #1f8a4c; --gap: #b5651d; }
  * { box-sizing: border-box; }
  body { margin: 0; color: var(--text); background: #fff; font: 10pt/1.45 -apple-system, "Segoe UI", Roboto, sans-serif;
         -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  h1 { font-size: 18pt; margin: 0 0 6pt; }
  .meta { display: flex; flex-wrap: wrap; gap: 2pt 16pt; font-size: 9pt; color: var(--muted); margin-bottom: 12pt; }
  .meta b { color: var(--text); font-weight: 600; }
  table { width: 100%; border-collapse: collapse; font-size: 9.5pt; margin-bottom: 4pt; }
  th { text-align: left; font-size: 8pt; text-transform: uppercase; letter-spacing: .04em; color: var(--muted);
       padding: 4pt; border-bottom: 1px solid var(--text); }
  td { padding: 4pt; border-bottom: 1px solid var(--border); }
  td:not(:first-child), th:not(:first-child) { text-align: right; white-space: nowrap; }
  section { margin-top: 18pt; }
  h2 { font-size: 13pt; margin: 0; padding-bottom: 3pt; border-bottom: 2px solid var(--text); break-after: avoid; }
  .values { font-size: 8.5pt; font-style: italic; color: var(--muted); margin: 3pt 0 0; }
  .group + .group { margin-top: 8pt; }
  .lead { break-inside: avoid; }
  .group:first-child h3 { margin-top: 8pt; }
  .group h3 { display: flex; justify-content: space-between; font-size: 8.5pt; text-transform: uppercase; letter-spacing: .04em;
              margin: 0 0 4pt; padding: 3pt 7pt; border-radius: 4pt; break-after: avoid; }
  .group.current h3 { background: var(--current-soft); color: var(--current); }
  .group.next h3 { background: var(--next-soft); color: var(--next); }
  ul { list-style: none; margin: 0; padding: 0; }
  li.item { display: flex; gap: 7pt; padding: 4pt 0 4pt 2pt; border-bottom: 1px solid var(--soft); break-inside: avoid; }
  .mark { width: 10pt; flex: none; font-weight: 700; }
  li.yes .mark { color: var(--yes); }
  li.no .mark { color: var(--muted); }
  li.no .text { color: var(--muted); }
  li.yes .text { font-weight: 500; }
  ul.notes { margin-top: 2pt; }
  ul.notes li { font-size: 9pt; padding: 1pt 0 1pt 8pt; border-left: 2px solid var(--border); margin: 2pt 0; }
  ul.notes li.gap { border-left-color: var(--gap); }
  .tag { font-size: 7.5pt; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin-right: 6pt; }
  li.gap .tag { color: var(--gap); }
  li.none { font-size: 8.5pt; font-style: italic; color: var(--muted); border: none; }
</style>
</head>
<body>
  <h1>{{TITLE}}</h1>
  <div class="meta">{{META}}</div>
  {{SUMMARY}}
  {{SECTIONS}}
</body>
</html>
